[package]
name = "lagodb-base"
version = { workspace = true }
publish = false
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
# pgrx 0.19's pg_shmem_init! macro still contains version gates for these
# historical PostgreSQL features. They are macro expansion inputs, not runtime
# features supported by this crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pg13", "pg14", "pg15"))'] }

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "lagodb-core/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "lagodb-core/pg17"]
pg18 = []
pg19 = []
pg_test = []

[dependencies]
pgrx = { workspace = true }
lagodb-core = { path = "../lagodb-core", default-features = false }
lagodb-storage = { workspace = true }
libc = "0.2"
thiserror = "1.0.63"
tokio = { version = "1", features = ["rt-multi-thread", "time"], default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pgrx-tests = { workspace = true }

[build-dependencies]
cc = "1"
pgrx-pg-config = "=0.19.2"
