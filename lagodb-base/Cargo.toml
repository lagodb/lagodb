[package]
name = "lagodb-base"
version = { workspace = true }
publish = false
license = { workspace = true }
description = "LagoDB base PostgreSQL extension and shared runtime."
homepage = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
# pgrx 0.19's pg_shmem_init! macro still contains version gates for these
# unsupported PostgreSQL features. They are macro expansion inputs, not runtime
# features supported by this crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pg13", "pg14", "pg19"))'] }

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15", "lagodb-core/pg15", "lagodb-query/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "lagodb-core/pg16", "lagodb-query/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "lagodb-core/pg17", "lagodb-query/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18", "lagodb-core/pg18", "lagodb-query/pg18"]
pg_test = []

[dependencies]
arrow-schema = { workspace = true }
pgrx = { workspace = true }
lagodb-core = { path = "../lagodb-core", default-features = false }
lagodb-query = { path = "../lagodb-query", default-features = false }
lagodb-storage = { workspace = true }
libc = "0.2"
thiserror = "1.0.63"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
pgrx-tests = { workspace = true }
