name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PGRX_POSTGRES_CACHE_VERSION: "v2"
  PGRX_VERSION: "0.18.1"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Check formatting
        run: cargo fmt --all -- --check

  pg17-read-stream-layout:
    name: PG17 ReadStream layout ${{ matrix.epoch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - epoch: 17.0-17.4
            minors: "0 1 2 3 4"
            sha256: 8d9bc88420e3979af108e787e243cb5792c96f7eac3ad9d159b444a223074e62
          - epoch: 17.5-17.10
            minors: "5 6 7 8 9 10"
            sha256: 5b4638b6f9f101f9de5a4378025ed25bd28521ada4855f1aec4a2d07718e4000

    steps:
      - name: Verify private ReadStream source
        env:
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          PG17_MINORS: ${{ matrix.minors }}
        run: |
          set -euo pipefail
          for minor in ${PG17_MINORS}; do
            source_url="https://raw.githubusercontent.com/postgres/postgres/REL_17_${minor}/src/backend/storage/aio/read_stream.c"
            actual_sha256="$(curl --fail --location --silent --show-error "${source_url}" | sha256sum | awk '{print $1}')"
            if [[ "${actual_sha256}" != "${EXPECTED_SHA256}" ]]; then
              echo "PostgreSQL 17.${minor} ReadStream layout requires audit" >&2
              exit 1
            fi
          done

  test:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        postgres:
          - "17"

    env:
      PG_FEATURE: pg${{ matrix.postgres }}
      PG_VERSION: ${{ matrix.postgres }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: cargo-${{ runner.os }}-pg${{ matrix.postgres }}-${{ env.PGRX_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-pg${{ matrix.postgres }}-${{ env.PGRX_VERSION }}-
            cargo-${{ runner.os }}-pg${{ matrix.postgres }}-

      - name: Cache cargo-pgrx
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ runner.os }}-${{ env.PGRX_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install PostgreSQL build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            bison \
            flex \
            libclang-dev \
            libicu-dev \
            libreadline-dev \
            libssl-dev \
            pkg-config \
            python3 \
            zlib1g-dev

      - name: Install cargo-pgrx
        run: |
          set -euo pipefail
          if ! command -v cargo-pgrx >/dev/null 2>&1; then
            cargo install --locked cargo-pgrx --version "${PGRX_VERSION}"
          elif ! cargo pgrx --version | grep -q "cargo-pgrx ${PGRX_VERSION}"; then
            cargo install --locked --force cargo-pgrx --version "${PGRX_VERSION}"
          fi
          cargo pgrx --version

      - name: Cache pgrx-managed PostgreSQL
        uses: actions/cache@v5
        with:
          path: |
            ~/.pgrx/config.toml
            ~/.pgrx/${{ matrix.postgres }}.[0-9]*
          key: pgrx-postgres-pg${{ matrix.postgres }}-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PGRX_POSTGRES_CACHE_VERSION }}

      - name: Initialize pgrx
        run: |
          set -euo pipefail
          if ! cargo pgrx info pg-config "pg${PG_VERSION}" >/dev/null 2>&1; then
            cargo pgrx init "--pg${PG_VERSION}=download"
          fi
          PG_CONFIG="$(cargo pgrx info pg-config "pg${PG_VERSION}")"
          echo "PG_CONFIG=${PG_CONFIG}" >> "${GITHUB_ENV}"
          echo "$(dirname "${PG_CONFIG}")" >> "${GITHUB_PATH}"
          cargo pgrx info pg-config "pg${PG_VERSION}"
          test -x "$("${PG_CONFIG}" --pkglibdir)/pgxs/src/test/isolation/pg_isolation_regress"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked --no-deps --no-default-features --features "${PG_FEATURE}" -- -D warnings

      - name: Verify Docker
        run: |
          set -euo pipefail
          . pg-iceberg-am/tests/pg_regress/config/object_storage.defaults.env
          MINIO_IMAGE="${MINIO_IMAGE:-${DEFAULT_MINIO_IMAGE}}"
          docker version
          docker info
          docker pull "${MINIO_IMAGE}"

      - name: Run test suite
        run: cargo xtask test-all "pg${PG_VERSION}"

      - name: Upload PostgreSQL test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-artifacts-pg${{ matrix.postgres }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            pg-iceberg-am/tests/pg_regress/regression.diffs
            pg-iceberg-am/tests/pg_regress/regression.out
            pg-iceberg-am/tests/pg_regress/log/
            pg-iceberg-am/tests/pg_regress/results/
            target/isolation/pg${{ matrix.postgres }}/output_iso/
