name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Keep file and line backtraces but drop full debug info, which dominates
  # the size of each cached target directory.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PGRX_POSTGRES_CACHE_VERSION: "v3-injection-points"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        postgres:
          - "15"
          - "16"
          - "17"
          - "18"

    env:
      PG_VERSION: pg${{ matrix.postgres }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Resolve cargo-pgrx version from workspace
        id: pgrx
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '
                [
                  .packages[].dependencies[]
                  | select(.name == "pgrx")
                  | .req
                ]
                | if length == 0 then
                    error("workspace does not declare pgrx")
                  elif any(.[]; startswith("=") | not) then
                    error("all workspace pgrx dependencies must use an exact version")
                  else
                    map(ltrimstr("="))
                    | unique
                    | if length == 1 then .[0]
                      else error("expected one workspace pgrx version")
                      end
                  end
              '
          )"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pg${{ matrix.postgres }}-${{ env.PGRX_POSTGRES_CACHE_VERSION }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache cargo-pgrx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ runner.os }}-${{ steps.pgrx.outputs.version }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install PostgreSQL build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            bison \
            flex \
            libclang-dev \
            libicu-dev \
            libreadline-dev \
            libssl-dev \
            pkg-config \
            python3 \
            zlib1g-dev

      - name: Install cargo-pgrx
        env:
          PGRX_VERSION: ${{ steps.pgrx.outputs.version }}
        run: |
          set -euo pipefail
          if ! command -v cargo-pgrx >/dev/null 2>&1; then
            cargo install --locked cargo-pgrx --version "${PGRX_VERSION}"
          elif ! cargo pgrx --version | grep -Fqx "cargo-pgrx ${PGRX_VERSION}"; then
            cargo install --locked --force cargo-pgrx --version "${PGRX_VERSION}"
          fi
          cargo pgrx --version

      - name: Cache pgrx-managed PostgreSQL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pgrx/config.toml
            ~/.pgrx/${{ matrix.postgres }}.[0-9]*
          key: pgrx-postgres-pg${{ matrix.postgres }}-${{ steps.pgrx.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PGRX_POSTGRES_CACHE_VERSION }}

      - name: Initialize pgrx
        run: |
          set -euo pipefail
          if ! cargo pgrx info pg-config "${PG_VERSION}" >/dev/null 2>&1; then
            case "${PG_VERSION}" in
              pg15 | pg16)
                cargo pgrx init "--${PG_VERSION}=download"
                ;;
              *)
                cargo pgrx init "--${PG_VERSION}=download" \
                  --configure-flag=--enable-injection-points
                ;;
            esac
          fi
          PG_CONFIG="$(cargo pgrx info pg-config "${PG_VERSION}")"
          echo "PG_CONFIG=${PG_CONFIG}" >> "${GITHUB_ENV}"
          echo "$(dirname "${PG_CONFIG}")" >> "${GITHUB_PATH}"
          echo "${PG_CONFIG}"
          case "${PG_VERSION}" in
            pg15 | pg16) ;;
            *)
              grep -Fx '#define USE_INJECTION_POINTS 1' \
                "$("${PG_CONFIG}" --includedir-server)/pg_config.h"
              ;;
          esac
          test -x "$("${PG_CONFIG}" --pkglibdir)/pgxs/src/test/isolation/pg_isolation_regress"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked --no-deps --no-default-features --features "${PG_VERSION}" -- -D warnings

      - name: Prepare regression fixture images
        run: python3 scripts/pg_regress/regress_fixture.py prepare-images --iceberg

      - name: Run test suite
        run: cargo --locked xtask test-all "${PG_VERSION}"

      - name: Upload PostgreSQL test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-test-artifacts-pg${{ matrix.postgres }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            lagodb-iceberg/tests/pg_regress/regression.diffs
            lagodb-iceberg/tests/pg_regress/regression.out
            lagodb-iceberg/tests/pg_regress/log/
            lagodb-iceberg/tests/pg_regress/results/
            lagodb-connectors/tests/pg_regress/regression.diffs
            lagodb-connectors/tests/pg_regress/regression.out
            lagodb-connectors/tests/pg_regress/log/
            lagodb-connectors/tests/pg_regress/results/
            target/fixture-images/
            target/isolation/pg${{ matrix.postgres }}/output_iso/
