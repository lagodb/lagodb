[workspace]
members = [
    "lagodb-base",
    "pg-delta-am",
    "lagodb-core",
    "lagodb-query",
    "lagodb-macros",
    "lagodb-iceberg",
    "pg-arrow-conv",
    "pg-backend-tests",
    "lagodb-connectors",
    "xtask",
]
resolver = "2"

# The [workspace.package] section defines default values for all member packages.
[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.97.1"
homepage = "https://github.com/robertmu/pg-lakebase"
repository = "https://github.com/robertmu/pg-lakebase"

[workspace.dependencies]
arrow-arith = "59.1.0"
arrow-array = "59.1.0"
arrow-buffer = "59.1.0"
arrow-cast = "59.1.0"
arrow-ord = "59.1.0"
arrow-schema = "59.1.0"
arrow-select = "59.1.0"
arrow-string = "59.1.0"
datafusion = { version = "=55.0.0", default-features = false }
datafusion-proto = { version = "=55.0.0", default-features = false }
pgrx = { version = "=0.19.2" }
pgrx-pg-sys = { version = "=0.19.2" }
pgrx-tests = { version = "=0.19.2" }
roaring = { version = "0.11" }
lagodb-storage = { git = "https://github.com/lagodb/lagodb-storage.git", rev = "5568ac353191d47dc6911862544be19ddab90352" }

# The 'dev' profile is used when you run `cargo build`.
[profile.dev]
panic = "unwind"
lto = false

# The 'release' profile is used for production builds with `cargo build --release`.
[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
