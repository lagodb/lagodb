[workspace]
members = [
    "lagodb-base",
    "lagodb-delta",
    "lagodb-core",
    "lagodb-query",
    "lagodb-macros",
    "lagodb-iceberg",
    "lagodb-arrow",
    "lagodb-connectors",
    "xtask",
]
resolver = "2"

# The [workspace.package] section defines default values for all member packages.
[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.97.1"
description = "LagoDB: Lakehouse database built on PostgreSQL."
homepage = "https://github.com/lagodb/lagodb"
repository = "https://github.com/lagodb/lagodb"

[workspace.dependencies]
arrow-arith = "59.2.0"
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-cast = "59.2.0"
arrow-ord = "59.2.0"
arrow-schema = { version = "59.2.0", features = ["serde", "canonical_extension_types"] }
arrow-select = "59.2.0"
arrow-string = "59.2.0"
datafusion = { version = "=55.0.0", default-features = false }
datafusion-distributed = {
    git = "https://github.com/lagodb/datafusion-distributed.git",
    rev = "e09e50a8d4fdfc4a8d5329daa3798e148351c6be",
    default-features = false,
    features = ["grpc"],
}
datafusion-proto = { version = "=55.0.0", default-features = false }
pgrx = { version = "=0.19.2" }
pgrx-pg-sys = { version = "=0.19.2" }
pgrx-tests = { version = "=0.19.2" }
prost = "0.14.1"
hyper-util = { version = "0.1.16", default-features = false, features = ["tokio"] }
tonic = { version = "0.14.1", features = ["transport"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
roaring = { version = "0.11" }
url = "2.5.7"
lagodb-storage = { git = "https://github.com/lagodb/lagodb-storage.git", rev = "59a53c284a20a0cd336f3f093e0584a4a3207e2a" }

# The 'dev' profile is used when you run `cargo build`.
[profile.dev]
panic = "unwind"
lto = false

# The 'release' profile is used for production builds with `cargo build --release`.
[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

