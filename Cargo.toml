[workspace]
members = [
    "lagodb-base",
    "pg-delta-am",
    "lagodb-core",
    "lagodb-macros",
    "lagodb-iceberg",
    "pg-arrow-conv",
    "pg-backend-tests",
    "iceberg-lite",
    "lagodb-connectors",
    "xtask",
]
resolver = "2"

# The [workspace.package] section defines default values for all member packages.
[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.97.1"
homepage = "https://github.com/robertmu/pg-lakebase"
repository = "https://github.com/robertmu/pg-lakebase"

[workspace.dependencies]
pgrx = { version = "=0.19.2" }
pgrx-pg-sys = { version = "=0.19.2" }
pgrx-tests = { version = "=0.19.2" }
roaring = { version = "0.11" }
lagodb-storage = { git = "https://github.com/lagodb/lagodb-storage.git", rev = "1b7428de428725c5a403f45c35532efae427c9c8" }

# The 'dev' profile is used when you run `cargo build`.
[profile.dev]
panic = "unwind"
lto = false

# The 'release' profile is used for production builds with `cargo build --release`.
[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
