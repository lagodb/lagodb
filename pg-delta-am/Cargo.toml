[package]
name = "pg-delta-am"
version = { workspace = true }
publish = false
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16", "lagodb-core/pg16"]
pg17 = ["pgrx/pg17", "lagodb-core/pg17"]
pg_test = []

[dependencies]
pgrx = { workspace = true }
lagodb-core = { path = "../lagodb-core", default-features = false }
