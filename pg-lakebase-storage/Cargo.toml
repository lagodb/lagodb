[package]
name = "pg-lakebase-storage"
edition.workspace = true
license.workspace = true
authors = ["Robert Mu. https://github.com/robertmu"]
description = "pg-lakebase-storage: local object-storage backed file service"
readme = "README.md"
keywords = ["storage", "object-store", "cache"]
categories = ["network-programming", "filesystem"]
publish = false
include = ["src/**/*", "src/*", "Cargo.toml", "LICENSE", "README.md"]


[lib]
doctest = false

[dependencies]
arc-swap = "1"
byteorder = "1.4"
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "fs", "rt", "macros", "time"], default-features = false }
tracing = "0.1.31"
async-trait = "0.1.9"
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
libc = "0.2"
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure"] }
redb = "3.1.1"
thiserror = "2.0.18"
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
aws-sdk-s3 = "1"
tempfile = "3"
testcontainers = "0.27"

[[test]]
name = "e2e"
required-features = ["integration"]

[features]
strict = []
integration = []
