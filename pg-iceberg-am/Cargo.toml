[package]
name = "pg-iceberg-am"
version = { workspace = true }
publish = false
homepage = "https://github.com/robertmu/pg-lakebase"
repository = "https://github.com/robertmu/pg-lakebase"
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "pg-lakebase-core/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "pg-lakebase-core/pg17"]
# `pg_test` compiles the `#[pgrx::pg_test]` modules into the extension cdylib
# (not under `cfg(test)`), so any crate those backend tests use must be a
# normal dependency, not a dev-dependency. The classifier shape-matrix
# property test (`customscan/pg_test.rs`) drives `proptest` through a manual
# `TestRunner`, so pull `proptest` in here. Mirrors `pg-lakebase-core-tests`,
# which lists `proptest` as a normal dependency for the same reason.
pg_test = ["dep:proptest"]

[dependencies]
pgrx = { workspace = true }
pg-lakebase-core = { path = "../pg-lakebase-core" }
pg-lakebase-storage = { path = "../pg-lakebase-storage" }
iceberg-lite = { path = "../iceberg-lite" }
thiserror = "1.0"
serde_json = "1.0"
arrow-schema = "57"
arrow-array = "57"
parquet = { version = "57", default-features = false, features = ["arrow"] }
tempfile = "3.10"
bytes = "1.10.1"

# Rustls is shared by some other dependencies but not directly used by pg-iceberg-am.
# Since Rustls 0.22, it is required to choose the provider of the cryptographic
# primitives at start.
# ref: https://docs.rs/rustls/latest/rustls/index.html#cryptography-providers
rustls = "0.23.27"

uuid = { version = "1.16.0" }

rust_decimal = { version = "1.37.1" }
libc = "0.2.179"
arrow-buffer = "57"

# Optional: enabled only by the `pg_test` feature. The `#[pgrx::pg_test]`
# modules are compiled into the extension cdylib (gated on `feature =
# "pg_test"`, not `cfg(test)`), where dev-dependencies are NOT linked — so the
# backend property tests in `customscan/pg_test.rs` need `proptest` as a normal
# (optional) dependency. It is also listed under `[dev-dependencies]` so host
# `#[cfg(test)]` proptests (e.g. `customscan/translator.rs`) and clippy
# `--all-targets` keep working when the `pg_test` feature is off.
proptest = { version = "1.5", optional = true }

[dev-dependencies]
pgrx-tests = { workspace = true }
proptest = "1.5"
