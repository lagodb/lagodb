[package]
name = "pg-backend-tests"
version = { workspace = true }
publish = false
authors = ["Robert Mu. https://github.com/robertmu"]
license = { workspace = true }
description = "Backend (#[pg_test]) integration tests for the pg-lakebase framework library crates (pg-lakebase-core, pg-arrow-conv) that require a running PostgreSQL instance."
homepage = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg17"]
pg16 = [
    "pgrx/pg16",
    "pgrx-tests/pg16",
    "pg-lakebase-core/pg16",
    "pg-lakebase-core/pg_test",
    "pg-arrow-conv/pg16",
]
pg17 = [
    "pgrx/pg17",
    "pgrx-tests/pg17",
    "pg-lakebase-core/pg17",
    "pg-lakebase-core/pg_test",
    "pg-arrow-conv/pg17",
]
pg_test = []

[dependencies]
pgrx = { workspace = true }
pg-lakebase-core = { path = "../pg-lakebase-core" }
pg-arrow-conv = { path = "../pg-arrow-conv", default-features = false }
arrow-array = "58"
arrow-schema = "58"
bytes = "1.10"
proptest = "1.5"
serde_json = "1.0"

[dev-dependencies]
pgrx-tests = { workspace = true }
