[package]
name = "pg-backend-tests"
version = { workspace = true }
publish = false
authors = ["Robert Mu. https://github.com/robertmu"]
license = { workspace = true }
description = "Backend (#[pg_test]) integration tests for the LagoDB framework library crates (lagodb-core, pg-arrow-conv) that require a running PostgreSQL instance."
homepage = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg17"]
pg16 = [
    "pgrx/pg16",
    "pgrx-tests/pg16",
    "lagodb-core/pg16",
    "pg-arrow-conv/pg16",
]
pg17 = [
    "pgrx/pg17",
    "pgrx-tests/pg17",
    "lagodb-core/pg17",
    "pg-arrow-conv/pg17",
]
pg_test = []

[dependencies]
pgrx = { workspace = true }
lagodb-core = { path = "../lagodb-core" }
pg-arrow-conv = { path = "../pg-arrow-conv", default-features = false }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
bytes = "1.10"
proptest = "1.5"
serde_json = "1.0"

[dev-dependencies]
pgrx-tests = { workspace = true }
