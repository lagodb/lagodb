[package]
name = "lagodb-arrow"
version = { workspace = true }
publish = false
license = { workspace = true }
description = "PostgreSQL-Arrow interoperability shared by LagoDB runtimes and providers."
homepage = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
# rlib: linked into extension cdylibs that consume the Arrow conversion or
# typed table-scan boundary. It never produces a cdylib.
crate-type = ["rlib"]

[features]
# Default to pg18 so `cargo test -p lagodb-arrow` (and any direct dependent)
# selects a Postgres version without an explicit `--features`, matching
# lagodb-core / lagodb-iceberg.
default = ["pg18"]
# Thread the supported PostgreSQL majors through to pgrx and core.
pg16 = ["pgrx/pg16", "lagodb-core/pg16"]
pg17 = ["pgrx/pg17", "lagodb-core/pg17"]
pg18 = ["pgrx/pg18", "lagodb-core/pg18"]

[dependencies]
pgrx = { workspace = true }
lagodb-core = { path = "../lagodb-core", default-features = false }
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ord = { workspace = true }
arrow-select = { workspace = true }
uuid = { version = "1.16.0" }
thiserror = "1.0"
libc = "0.2"

[dev-dependencies]
proptest = "1.5"
