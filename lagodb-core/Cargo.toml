[package]
name = "lagodb-core"
version = { workspace = true }
authors = ["Robert Mu. https://github.com/robertmu"]
license = { workspace = true }
description = "Postgres table access method, index access method and FDW framework in Rust."
homepage = { workspace = true }
repository = { workspace = true }
categories = ["database"]
keywords = ["database", "postgres", "postgresql", "extension", "access-method"]
edition = { workspace = true }
rust-version = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg18"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]

[dependencies]
pgrx = { workspace = true }
thiserror = "1.0.63"
lagodb-macros = { version = "0.1.0", path = "../lagodb-macros" }
lagodb-storage = { workspace = true }
bytes = "1.10"
uuid = { version = "1.16", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
percent-encoding = "2.3"
url = "2.5.7"

[dev-dependencies]
pgrx-tests = { workspace = true }
proptest = "1.5"

[build-dependencies]
cc = "1"
pgrx-pg-config = "=0.19.2"
shlex = "1.3"

[package.metadata.docs.rs]
features = ["pg18"]
no-default-features = true
# Enable `#[cfg(docsrs)]` (https://docs.rs/about/builds#cross-compiling)
rustc-args = ["--cfg", "docsrs"]
