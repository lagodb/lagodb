[package]
name = "lagodb-query"
version = { workspace = true }
publish = false
license = { workspace = true }
description = "DataFusion-backed query offload framework for LagoDB."
homepage = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16", "lagodb-core/pg16", "pg-arrow-conv/pg16"]
pg17 = ["pgrx/pg17", "lagodb-core/pg17", "pg-arrow-conv/pg17"]

[dependencies]
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt"], default-features = false }
lagodb-core = { path = "../lagodb-core", default-features = false }
pg-arrow-conv = { path = "../pg-arrow-conv", default-features = false }
pgrx = { workspace = true }
thiserror = "1.0.63"
