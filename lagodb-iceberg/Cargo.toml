[package]
name = "lagodb-iceberg"
version = { workspace = true }
publish = false
license = { workspace = true }
description = "LagoDB Apache Iceberg managed-table and foreign-table extension."
homepage = "https://github.com/robertmu/pg-lakebase"
repository = "https://github.com/robertmu/pg-lakebase"
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "lagodb-core/pg16", "pg-arrow-conv/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "lagodb-core/pg17", "pg-arrow-conv/pg17"]
pg_test = []

[dependencies]
pgrx = { workspace = true }
lagodb-core = { path = "../lagodb-core", default-features = false }
lagodb-storage = { workspace = true }
pg-arrow-conv = { path = "../pg-arrow-conv", default-features = false }
iceberg-lite = { git = "https://github.com/lagodb/iceberg-lite.git", rev = "0bbedb1418c99bf94163dc1d6c261c9f631b29b3" }
thiserror = "1.0"
serde_json = "1.0"
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
parquet = { version = "59.1.0", default-features = false, features = ["arrow"] }
roaring = { workspace = true }
tempfile = "3.10"
bytes = "1.10.1"
base64 = "0.22"
md-5 = "0.10"
rand = "0.9.3"
url = "2.5.7"
http = "1.3"
socket2 = "0.6"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

# Rustls is shared by some other dependencies but not directly used by lagodb-iceberg.
# Since Rustls 0.22, it is required to choose the provider of the cryptographic
# primitives at start.
# ref: https://docs.rs/rustls/latest/rustls/index.html#cryptography-providers
rustls = "0.23.27"

uuid = { version = "1.16.0" }

libc = "0.2.179"
arrow-buffer = { workspace = true }

[dev-dependencies]
pgrx-tests = { workspace = true }
proptest = "1.5"
